# 文档生成清单
# Docs Manifest
# 负责生成项目文档

name: "Documentation"
description: "Project documentation files"
output_base: "docs"
batch: 8

files:
  # 架构文档
  - template: "architecture.md.tpl"
    output: "architecture.md"
    description: "Architecture documentation (DDD layers)"

  # 开发指南
  - template: "development.md.tpl"
    output: "development.md"
    description: "Development guide"

  # 部署指南
  - template: "deployment.md.tpl"
    output: "deployment.md"
    description: "Deployment guide"
