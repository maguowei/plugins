# 领域层模板生成清单
# Domain Layer - DDD 核心构建块

name: "Domain Layer"
description: "领域层 - Entity, Value Object, Domain Event, Repository, Domain Service"
output_base: "{{ .Paths.Domain }}"
batch: 2

# 文件生成列表
files:
  # Entity (实体)
  - template: "entity/entity.go.tpl"
    output: "{{ .Aggregate.Name }}/entity/{{ .Entity.FileName }}.go"
    description: "{{ .Entity.NameCN }}实体"
    condition: "{{ .IncludeExamples }}"

  - template: "entity/entity_test.go.tpl"
    output: "{{ .Aggregate.Name }}/entity/{{ .Entity.FileName }}_test.go"
    description: "{{ .Entity.NameCN }}实体测试"
    condition: "{{ .IncludeExamples }}"

  # Value Objects (值对象)
  - template: "valueobject/email.go.tpl"
    output: "{{ .Aggregate.Name }}/valueobject/email.go"
    description: "Email 值对象"
    condition: "{{ and .IncludeExamples (eq .Aggregate.Name \"user\") }}"

  - template: "valueobject/value_object_test.go.tpl"
    output: "{{ .Aggregate.Name }}/valueobject/email_test.go"
    description: "Email 值对象测试"
    condition: "{{ and .IncludeExamples (eq .Aggregate.Name \"user\") }}"

  # Domain Events (领域事件)
  - template: "event/created.go.tpl"
    output: "{{ .Aggregate.Name }}/event/{{ .Entity.FileName }}_created.go"
    description: "{{ .Entity.NameCN }}创建事件"
    condition: "{{ .IncludeExamples }}"

  - template: "event/updated.go.tpl"
    output: "{{ .Aggregate.Name }}/event/{{ .Entity.FileName }}_updated.go"
    description: "{{ .Entity.NameCN }}更新事件"
    condition: "{{ .IncludeExamples }}"

  # Repository Interface (仓储接口)
  - template: "repository/repository.go.tpl"
    output: "{{ .Aggregate.Name }}/repository/{{ .Repository.FileName }}.go"
    description: "{{ .Repository.NameCN }}接口"
    condition: "{{ .IncludeExamples }}"

  # Domain Service (领域服务)
  - template: "service/domain_service.go.tpl"
    output: "{{ .Aggregate.Name }}/service/{{ .DomainService.FileName }}.go"
    description: "{{ .DomainService.NameCN }}"
    condition: "{{ .IncludeExamples }}"

  # Event Bus Interface (事件总线接口 - 通用)
  - template: "event/event_bus.go.tpl"
    output: "event/event_bus.go"
    description: "事件总线接口"
