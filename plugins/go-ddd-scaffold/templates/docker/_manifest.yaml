# Docker 配置生成清单
# Docker Manifest
# 负责生成 Docker 相关的配置文件

name: "Docker Configuration"
description: "Docker and Docker Compose configuration files"
output_base: "."
batch: 7

files:
  # Dockerfile
  - template: "Dockerfile.tpl"
    output: "Dockerfile"
    description: "Multi-stage Dockerfile for production builds"

  # Docker Compose
  - template: "docker_compose.yaml.tpl"
    output: "docker-compose.yml"
    description: "Docker Compose configuration for local development"
