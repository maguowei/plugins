# CMD 命令行入口生成清单
# CMD Manifest
# 负责生成应用程序的命令行入口文件

name: "CMD Entry Points"
description: "Command-line entry points for server and migrations"
output_base: "cmd"
batch: 6

files:
  # 服务器入口
  - template: "server_main.go.tpl"
    output: "server/main.go"
    description: "HTTP server entry point"

  # 数据库迁移入口
  - template: "migrate_main.go.tpl"
    output: "migrate/main.go"
    description: "Database migration entry point"
